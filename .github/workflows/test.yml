name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Install pinned optional Physica (integration test only)
        run: python -m pip install "git+https://github.com/thebrazenbeard/physica.git@a33e3a8c94787cc884dd7c668b709ff1ec945551"
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Offline demo
        run: vera-ark demo --steps 2 --log-dir .vera_ark/ci-demo