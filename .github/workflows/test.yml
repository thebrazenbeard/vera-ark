name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        id: install
        continue-on-error: true
        run: python -m pip install -e ".[dev]" > install-log.txt 2>&1
      - name: Test
        id: tests
        continue-on-error: true
        run: python -m pytest > pytest-log.txt 2>&1
      - name: Compile
        id: compile
        continue-on-error: true
        run: python -m compileall -q src tests > compile-log.txt 2>&1
      - name: Offline demo
        id: demo
        continue-on-error: true
        run: vera-ark demo --steps 2 --log-dir .vera_ark/ci-demo > demo-log.txt 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vera-ark-diagnostics-${{ runner.os }}
          path: |
            install-log.txt
            pytest-log.txt
            compile-log.txt
            demo-log.txt
      - name: Fail on diagnostic step failure
        if: steps.install.outcome != 'success' || steps.tests.outcome != 'success' || steps.compile.outcome != 'success' || steps.demo.outcome != 'success'
        run: exit 1
